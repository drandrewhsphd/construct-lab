<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Construct Lab · Home</title><style>body{margin:0;background:#eef3f6;color:#203748;font:17px/1.6 system-ui}main{max-width:1100px;margin:auto;padding:28px}h1{font-size:36px}.projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}article{background:white;padding:24px;border:1px solid #d5e1e6;border-radius:12px}a{color:#086d76}.action{display:inline-block;background:#086d76;color:white;padding:10px 16px;border-radius:5px;text-decoration:none;margin:8px 0}small{color:#526575}</style><main><h1>Welcome to Construct Lab</h1><p>This is your single starting point. Choose a project below; the shared navigation stays available throughout the workflow.</p><p><strong>Building the system?</strong> Use the demonstration. You do not need to review your Curiosity evidence before continuing development.</p><div id="projects" class="projects"></div><p id="error" role="status"></p></main><script>
(async()=>{try{const r=await fetch('/api/navigation');if(!r.ok)throw Error('Unable to load projects');const d=await r.json();for(const p of d.projects){const card=document.createElement('article'),h=document.createElement('h2'),type=document.createElement('small'),text=document.createElement('p'),a=document.createElement('a'),overview=document.createElement('a');h.textContent=p.name;type.textContent=p.demonstration?'SYNTHETIC DEMONSTRATION':'Research project';text.textContent=p.next.detail;a.className='action';a.href='/'+p.next.path+'?project='+encodeURIComponent(p.id);a.textContent=p.next.label;overview.href='/dashboard?project='+encodeURIComponent(p.id);overview.textContent='Project overview';card.append(type,h,text,a,document.createElement('br'),overview);document.getElementById('projects').append(card)}}catch(e){document.getElementById('error').textContent=e.message+'. Reload to retry.'}})();
</script></html>
