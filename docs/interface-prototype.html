<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Construct Lab · Developer wireframe</title>
<style>
:root{--navy:#193849;--teal:#11776f;--blue:#285d8b;--ink:#273f4b;--muted:#637680;--line:#cad7de;--bg:#f3f6f8;--wash:#e8f4f0;--human:#eaf1f9;--amber:#855c25;--red:#a43832}*{box-sizing:border-box}body{margin:0;font:15px/1.42 'Helvetica Neue',Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea,select{font:inherit}button,a{cursor:pointer}button{border:1px solid #bdcdd5;background:white;border-radius:5px;padding:9px 14px;color:var(--navy);font-weight:600}button:hover{background:#f2f6f8}button:disabled{opacity:.42;cursor:not-allowed}.primary{background:var(--teal);color:white;border-color:var(--teal)}.primary:hover{background:#0e665f}.danger{color:var(--red)}input,textarea,select{border:1px solid #afc3ce;border-radius:4px;padding:9px 11px;background:white;color:var(--ink);width:100%}textarea{resize:vertical;min-height:76px;line-height:1.42}input[type=checkbox],input[type=radio]{width:17px;height:17px;margin:2px 8px 0 0;accent-color:var(--teal)}label{display:block}label>span:first-child,.field-label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}h1,h2,h3,p{margin:0}h1{font-size:26px;line-height:1.25;color:var(--navy);letter-spacing:-.4px}h2{font-size:17px;color:var(--navy);margin-bottom:12px}h3{font-size:14px;color:var(--teal);margin-bottom:9px}.small{font-size:12px;color:var(--muted)}.top{height:60px;padding:0 24px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:700;font-size:19px}.top .small{color:#c8dce6}.top button{background:transparent;color:#fff;border-color:#57717e;font-size:12px;padding:7px 10px}.demo{height:29px;padding:6px 24px;background:#fff6e6;color:#795928;font-size:12px;border-bottom:1px solid #e3d6bc;display:flex;justify-content:space-between}.shell{display:grid;grid-template-columns:202px 1fr;min-height:calc(100vh - 89px)}nav{padding:20px 12px;border-right:1px solid var(--line);background:#edf2f5}nav .group{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);padding:13px 10px 5px}nav a{display:flex;gap:9px;text-decoration:none;color:var(--ink);padding:9px 10px;border-radius:5px;font-size:13px;margin:2px 0}nav a.active{background:#fff;color:var(--teal);box-shadow:0 0 0 1px #c7d7dc;font-weight:700}.num{font-size:11px;opacity:.75;width:18px}main{padding:22px 24px 16px;min-width:0}.heading{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:15px;gap:15px}.sub{font-size:13px;color:var(--muted);margin-top:5px}.badge{font-size:11px;font-weight:700;border-radius:4px;padding:5px 8px;display:inline-block;white-space:nowrap;background:var(--human);color:var(--blue)}.badge.ai{background:var(--wash);color:var(--teal)}.badge.code{background:#e8ebf1;color:#566171}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}.panel{background:white;border:1px solid var(--line);border-radius:7px;padding:18px}.panel+.panel{margin-top:13px}.assistant{background:#eaf4f1;border:1px solid #c2ded5;border-radius:7px;padding:17px;min-height:330px}.assistant h2{font-size:16px;color:var(--teal)}.assistant p{font-size:14px;margin:12px 0}.assistant .meta{border-top:1px solid #c2d9d2;margin-top:18px;padding-top:13px;font-size:12px;color:var(--muted)}.ai-state{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--teal)}.dot{width:6px;height:6px;background:var(--teal);border-radius:50%}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}.row{padding:10px 0;border-bottom:1px solid #e1e8eb}.row:last-child{border:0}.flex{display:flex;justify-content:space-between;align-items:center;gap:12px}.check{display:flex;align-items:flex-start;margin:10px 0}.check span{font-size:14px}.check small{display:block;color:var(--muted);font-size:12px}.notice{padding:11px 13px;background:#fff5e4;border-left:3px solid #b6853c;font-size:13px;margin:12px 0}.notice.green{background:var(--wash);border-color:var(--teal)}.notice.red{background:#fff0ee;border-color:var(--red)}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:17px;padding-top:15px;border-top:1px solid var(--line)}.actions .small{margin-left:auto;max-width:250px}.status{padding:4px 7px;font-size:11px;border-radius:4px;background:#edf2f5;color:var(--muted);white-space:nowrap}.status.good{color:var(--teal);background:var(--wash)}.status.warn{background:#fff2de;color:var(--amber)}.status.bad{background:#fbe7e5;color:var(--red)}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--muted);font-size:11px;background:#f4f7f9}th,td{padding:10px 9px;border-bottom:1px solid #dae4e9;vertical-align:top}td:first-child,th:first-child{padding-left:8px}.quote{padding:13px;background:#f4f7f9;border-left:3px solid #849ca8;font-size:15px;line-height:1.5;margin:12px 0}.definition{font-size:17px;line-height:1.5;background:var(--wash);padding:15px;border-left:3px solid var(--teal);margin:12px 0}.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:-2px 0 16px}.tabs button{border:0;border-radius:0;padding:8px 0;font-size:13px;background:transparent;font-weight:500}.tabs button.selected{border-bottom:3px solid var(--teal);color:var(--teal);font-weight:700}.foot{margin-top:13px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.metric{font-size:28px;font-weight:700;color:var(--navy)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;padding:0 0 14px;border-bottom:1px solid var(--line);margin-bottom:13px}.meter{height:7px;border-radius:5px;background:#dde6eb;margin:7px 0}.meter>i{display:block;background:var(--teal);height:7px;border-radius:5px}.issue{color:var(--red)}details{margin:10px 0}summary{color:var(--teal);cursor:pointer;font-size:13px}dialog{width:620px;max-width:92vw;border:1px solid var(--line);border-radius:9px;padding:25px;box-shadow:0 14px 60px #102d3b55;color:var(--ink)}dialog::backdrop{background:#15303d66}dialog h2{font-size:23px}.toast{position:fixed;bottom:20px;left:230px;right:30px;background:#193849;color:white;padding:14px 20px;border-radius:6px;box-shadow:0 4px 20px #102d3b33;z-index:20}.hide{display:none!important}a.inline{color:var(--teal);font-weight:600}.error{font-size:12px;color:var(--red);margin-top:5px}.stack>div{padding:11px 0;border-bottom:1px solid var(--line)}.source-list{font-size:12px;color:var(--muted)}.history{font-size:12px;background:#f3f6f8;padding:11px;margin-top:12px}.readonly{background:#f1f5f7}.version{font-size:12px;color:var(--muted)}:focus-visible{outline:3px solid #79aee0;outline-offset:3px}@media(max-width:1100px){.layout{grid-template-columns:1fr 250px}.shell{grid-template-columns:177px 1fr}main{padding:18px}.panel{padding:15px}nav a{font-size:12px}}@media(max-width:850px){.layout{grid-template-columns:1fr}.assistant{min-height:0}.shell{grid-template-columns:160px 1fr}}@media(max-width:600px){.shell{display:block}nav{display:flex;overflow:auto;padding:6px}nav .group{display:none}nav a{min-width:145px}.top{padding:0 14px}.top .small{display:none}.demo{height:auto}.demo span:last-child{display:none}.twocol{grid-template-columns:1fr}.heading{flex-direction:column}.toast{left:15px}.metrics{gap:8px}.metric{font-size:22px}}

/* Desktop handoff layout: persistent navigation and scrollable work panels. */
@media(min-width:851px){
body{font-size:14px}.top{height:48px}.demo{height:26px;padding-top:4px}.shell{height:calc(100vh - 74px);min-height:0;overflow:hidden}nav{padding-top:8px;overflow:auto}nav .group{padding-top:10px}nav a{padding:7px 10px}main{padding:16px 20px 10px;overflow:auto}.heading{margin-bottom:12px}h1{font-size:24px}.panel{padding:14px}.field{margin-bottom:10px}textarea{min-height:60px}.assistant{padding:14px;min-height:0}.assistant p{margin:9px 0;font-size:13px}.layout>.content{min-width:0}.panel{max-height:calc(100vh - 180px);overflow:auto}.actions{position:sticky;bottom:-14px;background:white;margin-top:12px;padding:12px 0 0;z-index:2}.foot{margin-top:9px}.notice{margin:9px 0;padding:9px 11px}
}
@media(min-width:851px){
.panel{padding:12px}h2{margin-bottom:8px}.panel+.panel{margin-top:9px}input,textarea,select{padding:7px 9px}textarea{min-height:50px}.field{margin-bottom:8px}.check{margin:7px 0}.check span{font-size:13px}th,td{padding:7px 8px}.actions{padding-top:9px;margin-top:9px}.quote{font-size:14px;padding:9px;margin:9px 0}.definition{font-size:16px;padding:10px;margin:9px 0}.notice{font-size:12px;padding:8px 10px;margin:8px 0}.small{font-size:11px}button{padding:8px 11px}.assistant p{font-size:13px}.row{padding:8px 0}.panel .field-label,label>span:first-child{margin-bottom:4px}
}</style></head><body><header class="top"><div><span class="brand">Construct Lab</span><span class="small"> &nbsp; / &nbsp; Technology curiosity</span></div><div><button id="connections">Connections</button> &nbsp; <span class="small">Researcher · Can approve</span></div></header><div class="demo"><span>DEVELOPER PROTOTYPE · Synthetic evidence · Simulated AI and services</span><span>Each screen loads a named example snapshot</span></div><div class="shell"><nav aria-label="Research process"></nav><main id="main"></main></div><dialog id="modal"></dialog><div id="toast" class="toast hide" role="status"></div>
<script>
const titles=['Research framing','Literature discovery','Search boundary review','Evidence extraction and synthesis','Construct proposal','Revision adjudication','Change assessment','Candidate-stop review','Independent challenge tests','Challenge adjudication','Stop authorization','Audit record'];
const navLabels=['Frame research','Discover literature','Review scope','Extract evidence','Propose construct','Adjudicate revision','Assess change','Review candidate','Run challenges','Assess challenge','Authorize stop','Export audit'];
const roles=['Human leads','AI prepares','Human decides','AI prepares / Human verifies','AI proposes','Human decides','Code calculates / AI explains','Human decides','AI assists / Experts challenge','Human decides','Human authorizes','AI assembles / Human checks'];
const subtitles=['Define the phenomenon before choosing a construct label.','Review the search plan and source access before starting a job.','Approve inclusion rules and assign unresolved coverage gaps.','Read the source passage beside its proposed interpretation.','Review every part of the proposed theoretical representation.','Approve a specific change with a materiality judgment and rationale.','Compare approved snapshots and choose the next evidence target.','Review evidence-backed gates before freezing a candidate.','Search for evidence that could defeat the frozen representation.','Resolve the theoretical consequences of independent evidence.','Record a provisional stop within a defined scope and date.','Inspect the decision trail and assemble the methods package.'];
const stages=['Draft brief B-01','Search job J-01 complete','Boundary S-01 under review','Evidence E-02 pending review','Proposal R-01 unapproved','Revision R-01 pending','Approved v0 → v1','Later snapshot · candidate C-01','Frozen C-01 · challenge H-01','C-01 · material finding E-09','Later snapshot · candidate C-02','Authorized C-02 · audit A-02'];
let step=1, variant='', formValues={}, local={verified:false,authorized:false,reviewed:false};
const $=s=>document.querySelector(s), esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tag=(t,c='')=>`<span class="status ${c}">${t}</span>`;
const btn=(t,a,c='')=>`<button type="button" data-action="${a}" class="${c}">${t}</button>`;
const input=(label,id,value,type='input')=>`<label class="field"><span>${label}</span>${type==='textarea'?`<textarea id="${id}">${esc(formValues[id]??value)}</textarea>`:`<input id="${id}" value="${esc(formValues[id]??value)}">`}</label>`;
const select=(label,id,options)=>`<label class="field"><span>${label}</span><select id="${id}">${options.map(t=>`<option ${formValues[id]===t?'selected':''}>${t}</option>`).join('')}</select></label>`;
const check=(t,id,checked=false,small='')=>`<label class="check"><input type="checkbox" id="${id}" ${checked?'checked':''}><span>${t}${small?`<small>${small}</small>`:''}</span></label>`;
const table=(heads,rows)=>`<table><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const notice=(text,c='')=>`<div class="notice ${c}">${text}</div>`;
const panel=(title,html)=>`<section class="panel"><h2>${title}</h2>${html}</section>`;
const evidence=`<div class="flex"><strong>E-02 · Example record B</strong>${tag('Synthetic passage')}</div><p class="small">Conceptual article fixture · Section 2 · Full text available</p><div class="quote">“An individual may explore a technology to satisfy an employer’s requirement even when they have no personal desire to understand it.”</div>`;
function assistant(body,saved,refs='Brief B-01 · scoped project context'){return `<aside class="assistant"><h2>AI research assistant</h2><div class="ai-state"><i class="dot"></i> Proposal for human review</div><p>${body}</p><div class="source-list">Context: ${refs}</div>${btn('Inspect AI run','run-detail')}<div class="meta"><b>Output record</b><p>${saved}</p><b>Decision authority</b><p>AI proposes. Authorized researchers approve. Code enforces the gates.</p></div></aside>`}
function screen(){let body='',ai='',actions='';switch(step){
case 1:body=panel('Research brief',input('Phenomenon to explain *','phenomenon','Individuals actively want to understand and explore unfamiliar technologies.','textarea')+`<div class="twocol">${select('Theoretical purpose *','purpose',['Develop a new construct','Reconceptualize an existing construct','Integrate overlapping constructs'])}${select('Level of analysis *','level',['Individual','Team','Organization'])}</div><div class="twocol">${select('Temporal form *','temporal',['Unresolved: state or tendency','Momentary state','Stable tendency','Both, specified separately'])}${input('Candidate label (optional)','label','Technology curiosity')}</div>`+input('Initial search scope *','scope','Technology curiosity, general curiosity, exploration, and neighboring motivations.','textarea')+notice('Open issue Q-01: temporal form needs a theoretical justification.')+`<div class="actions">${btn('Save brief','save-brief','primary')}${btn('Probe assumptions','probe')}<span class="small">* Required. Saving creates a brief version.</span></div>`);ai=assistant('Distinguish the desire to understand from technology use, confidence, and required exploration. Is curiosity a state, a stable tendency, or both?','Draft brief B-01 and question Q-01');break;
case 2:body=panel('Search plan',input('Search family *','query','("technology curiosity" OR "digital curiosity" OR "epistemic curiosity")')+`<div class="twocol">${select('Adjacent search family','family',['Exploration and learning','Nearest competing constructs','General curiosity theory'])}${select('Retrieval boundary','years',['All years through 2026-09-28','Custom date range'])}</div><div class="flex"><span class="field-label">Selected sources</span>${btn('Configure sources','connections')}</div>${check('Scholarly search adapter A','source-a',true,'Synthetic adapter fixture. Metadata and abstracts.')}${check('Reference library import','source-b',true,'Synthetic import fixture. Permitted full-text files.')}`+`<div class="actions">${btn('Run search','search','primary')}${btn('View search log','search-log')}<span class="small">Queries and source responses retain provenance.</span></div>`)+panel('Merged results · synthetic example',table(['Record','Conceptual relevance','Access','Review'],[['A','Desire to close a knowledge gap',tag('Full text','good'),'Pending'],['B','Required versus voluntary exploration',tag('Full text','good'),'Pending'],['C','Novelty preference and technology choices',tag('Abstract only','warn'),'Pending']])+`<p class="small" style="margin-top:8px">3 unique records from 4 returned items · 1 duplicate merged</p>`);ai=assistant('The current query needs searches for exploration, novelty seeking, and general curiosity. Keep access limits visible when judging coverage.','SearchPlan SP-01, job J-01, Work A–C','B-01 · query family QF-01');break;
case 3:body=panel('Inclusion and exclusion rules',check('Include desire to understand technologies','include-one',true)+check('Include adjacent curiosity and exploration concepts','include-two',true)+check('Exclude adoption-only studies without conceptual evidence','exclude-one',true)+input('Boundary rationale *','scope-note','Include required and voluntary exploration to test whether motivation distinguishes the construct.','textarea'))+panel('Coverage review',table(['Domain or limit','Evidence status','Required action'],[['General curiosity theory',tag('Coverage gap','warn'),'Targeted search'],['Technology exploration',tag('Reviewed','good'),'Continue extraction'],['Record C full text',tag('Access gap','warn'),'Request permitted text']])+notice('Approving the boundary records the rules. Coverage remains incomplete until the gaps close.')+`<div class="actions">${btn('Approve boundary','approve-scope','primary')}${btn('Search coverage gap','broaden')}</div>`);ai=assistant('Technology-use studies dominate this example corpus. Expand into the originating curiosity literature before interpreting stable definitions as saturation.','ScopeVersion S-01 and coverage tasks G-01 / G-02','Search log J-01 · records A–C');break;
case 4:body=panel('Source evidence',evidence)+panel('Proposed extraction',table(['Field','AI interpretation','Human check'],[['Motivation','Personal desire versus external requirement','Pending'],['Observed behavior','Technology exploration','Pending'],['Temporal stability','Not stated','Pending']])+`<div class="definition" style="font-size:15px">Synthesis proposal: exploration alone is insufficient evidence of curiosity.</div>`+input('Correction or review note','extraction-note','The passage distinguishes motivation from behavior. It does not establish temporal stability.')+`<div class="actions">${btn('Verify extraction','verify','primary')}${btn('Save correction','correct')}${btn('Leave unresolved','unresolved')}</div>`);ai=assistant('This passage supports a motivation–behavior distinction. The statement that exploration is insufficient is an interpretation linked to E-02, ready for your review.','Claim CL-02, passage E-02, draft synthesis SY-01','Record B · section 2 · E-02');break;
case 5:body=panel('Theoretical representation · proposed',`<div class="tabs">${['Definition','Attributes','Boundaries','Network','Competitors'].map((x,i)=>btn(x,'tab-'+i,i===0?'selected':'')).join('')}</div><div id="tab-content">${input('Definition *','definition','A person’s desire to understand unfamiliar technologies through information seeking and exploration.','textarea')}${table(['Representation field','Proposed content','Evidence'],[['Entity / level','Person / individual','B-01'],['Temporal form','Unresolved','Q-01'],['Essential attribute','Desire to understand','E-01'],['Possible expression','Information seeking and exploration','E-02'],['Dimensions','No dimensions established','Not stated']])}</div>`+notice('Unapproved proposal. Resolve temporal form and review the behavior criterion before any stopping assessment.')+`<div class="actions">${btn('Submit for adjudication','submit-proposal','primary')}${btn('Save draft','save-draft')}</div>`);ai=assistant('E-02 suggests a revision: treat exploration as a possible expression, not a sufficient defining property. Compare novelty seeking before claiming distinctiveness.','Draft R-01 with field-level evidence links','Approved claims CL-01 / CL-02');break;
case 6:body=panel('Revision R-01 · decision required',`<div class="small">Current approved v0</div><p class="quote">A person’s desire to understand unfamiliar technologies through information seeking and exploration.</p><div class="small">Proposed approved definition v1</div><div class="definition">A person’s desire to understand unfamiliar technologies.</div><p class="small">Change: move observable exploration to the possible-expression field. Evidence E-02.</p><details><summary>Open source passage E-02</summary>${evidence}</details><div class="twocol">${select('Materiality classification *','materiality',['Definition-changing','Boundary-changing','Elaborative only','Redundant','Unresolved'])}${select('Decision *','decision',['Accept revision','Reject revision','Leave unresolved'])}</div>${input('Decision rationale *','rationale','Exploration can occur without curiosity. Observable behavior should not define the construct.','textarea')}`+notice('A material accepted revision creates v1 and resets the stability streak to 0.')+`<div class="actions">${btn('Record decision','record-decision','primary')}${btn('Compare full versions','compare')}</div>`);ai=assistant('The revision changes what counts as the construct. I recommend a material classification, but you determine the theoretical consequence.','Decision D-01, approved v1, reset event','R-01 · E-02 · approved v0');break;
case 7:body=panel('Approved version comparison',`<div class="flex"><span class="version">v0 compared with v1 · Batch B-01</span>${tag('Material change','bad')}</div><div class="metrics"><div><span class="small">Stable batches</span><div class="metric">0</div></div><div><span class="small">Material revisions</span><div class="metric">1</div></div><div><span class="small">Policy outcome</span><div class="metric" style="font-size:23px">Continue</div></div></div>`+table(['Dimension','Approved change','Consequence'],[['Definition','Behavior criterion removed','Reset'],['Attributes','Desire separated from enactment','Material'],['Competitors','Novelty-seeking comparison pending','Target search'],['Network','No accepted edge change','Diagnostic only']])+notice('Code records reset reason D-01. Semantic similarity cannot override this material change.')+input('Next search objective *','target','Evidence distinguishing the desire to understand from a preference for novelty.')+`<div class="actions">${btn('Create targeted search','targeted','primary')}${btn('Inspect metric record','metric-detail')}</div>`);ai=assistant('Search for cases of novelty preference without a desire to understand. That evidence could clarify the nearest competitor. The approved revision requires continued search.','MetricRun M-01 and next-search proposal NS-01','Approved v0 / v1 · human decision D-01');break;
case 8:body=panel('Candidate C-01 · later example snapshot',notice('This snapshot follows additional searching and adjudication after v1. Demo policy k = 3 is illustrative, not validated.','green')+table(['Eligibility gate','Record','Status'],[['Coverage within approved scope','Coverage review CV-03',tag('Pass','good')],['Convergence across evaluable batches','B-02, B-03, B-04 · streak 3 / 3',tag('Pass','good')],['No unresolved material issue','Issue register IR-04',tag(variant==='blocked'?'1 issue open':'Pass',variant==='blocked'?'bad':'good')]])+`<div class="history">Frozen candidate preview: C-01 will reference approved v1, scope S-01, and policy P-01.</div>`+input('Candidate rationale *','candidate-note','The declared scope and approved versions support moving to independent challenges.','textarea')+check('I reviewed the supporting gate records','candidate-check',false)+notice(variant==='blocked'?'Candidate blocked: resolve issue Q-04 in adjudication before requesting challenges.':'The system will freeze the current version. Authorization remains unavailable until fresh challenges pass.',variant==='blocked'?'red':'')+`<div class="actions"><button class="primary" data-action="freeze" id="freeze" disabled>Freeze candidate and request challenges</button>${btn('Continue searching','continue')}</div>`);ai=assistant('All displayed gate statuses come from recorded evidence and deterministic policy. Your review opens the challenge stage. It does not authorize a stop.','CandidateStop C-01 tied to a frozen snapshot','CV-03 · M-04 · IR-04 · P-01');break;
case 9:body=panel('Challenge plan H-01',`<div class="flex"><span class="version">Frozen candidate C-01 · approved v1</span>${tag('Ready to run')}</div>`+check('Held-out evidence','test-one',true,'Unused evidence, identified before development review')+check('Adversarial search','test-two',true,'Search an adjacent domain for counterexamples')+check('Search-order and model sensitivity','test-three',true,'Repeat the comparison under declared alternatives')+check('Independent expert review','test-four',true,'Assigned reviewer has not adjudicated the focal revision')+notice('Every required test needs a completed result. A partial run cannot support authorization.')+`<div class="actions">${btn('Run challenge plan','run-challenge','primary')}${btn('Inspect frozen candidate','frozen')}</div>`)+panel('Challenge finding · synthetic fixture',`<div class="flex"><strong>E-09 · Familiar technology counterexample</strong>${tag('Human review pending','warn')}</div><p style="margin-top:9px">A person wants to understand an unanswered question about a technology they already know.</p><p class="small" style="margin-top:7px">Possible boundary change: the word “unfamiliar”. Route finding to step 10.</p>`);ai=assistant('E-09 may challenge the unfamiliarity restriction. The comparison identifies a potential contradiction. An independent human must judge its consequence.','ChallengeRun H-01 and finding F-09','C-01 · reserved evidence partition H-01');break;
case 10:body=panel('Finding F-09 · human materiality review',`<div class="quote">Synthetic E-09: an individual seeks to understand an unanswered question about a familiar technology.</div><p class="small">Candidate C-01 definition: “A person’s desire to understand unfamiliar technologies.”</p><div class="twocol">${select('Finding classification *','finding',['Material boundary change','Coverage gap','Nonmaterial elaboration','Unresolved'])}${select('Evidence partition after decision','partition',['Move used evidence to development'])}</div>${input('Theoretical rationale *','finding-note','Unfamiliarity is too restrictive. Curiosity may concern an unanswered question about a familiar technology.','textarea')}`+notice('Material finding: retire C-01, reset streak to 0, reopen construct adjudication. A later candidate needs fresh challenges.')+`<div class="actions">${btn('Record finding and reopen','reopen','primary')}${btn('Leave unresolved','unresolved')}</div>`);ai=assistant('Revise the boundary only after the human decision. E-09 becomes development evidence once used. Reusing it as a fresh holdout would invalidate the next challenge.','Decision D-09 and candidate-retirement event','H-01 · F-09 · E-09 · C-01');break;
case 11:body=panel('Candidate C-02 · authorization review',notice('Later snapshot: revised v2, renewed convergence, and a fresh challenge H-02. C-01 remains retired.','green')+table(['Required evidence','Record','Status'],[['Approved representation','v2 · familiar and unfamiliar technologies',tag('Reviewed','good')],['Coverage and convergence','CV-07 · M-07 · policy P-01',tag('Pass','good')],['Fresh required challenges','H-02 · independent expert decision D-12',tag('Pass','good')],['Unresolved material issues','IR-07',tag('None','good')]])+`<div class="twocol">${input('Evidence cutoff *','cutoff','2026-09-28')}${input('Scope version *','stop-scope','S-02')}</div>`+input('Authorization rationale and reopening conditions *','stop-note','Provisionally stop within S-02. Reopen for a material counterexample, scope change, or new evidence altering the approved representation.','textarea')+check('I reviewed the evidence and accept the scoped decision','auth-check')+`<div class="actions"><button class="primary" data-action="authorize" id="authorize" disabled>Review and authorize stop</button>${btn('Record resource limit','budget')}</div>`);ai=assistant('I assemble the decision packet and draft its rationale. The authorization belongs to the researcher identified in the final record. A resource limit records an incomplete search.','StopDecision SD-02, signed by an authorized human','C-02 · v2 · H-02 · IR-07');break;
case 12:body=panel('Audit package A-02',`<div class="flex"><span class="version">Named fixture: authorized C-02</span>${tag('Provisional stop','good')}</div>`+table(['Package section','Versioned records','Include'],[['Research framing','B-01, scope S-01 / S-02','Yes'],['Search and evidence','Queries, jobs, exclusions, passages, access limits','Yes'],['Theoretical representation','v0, v1, v2, competitor and network records','Yes'],['Human adjudication','Materiality, rationale, dissent, approvals','Yes'],['Stopping and challenge history','Retired C-01, H-01, C-02, fresh H-02, SD-02','Yes'],['Reproducibility manifest','Prompts, model IDs, hashes, policies, timestamps','Yes']])+notice('Export citation placeholders separately. Synthetic fixtures contain no real publication claims.')+`<div class="twocol">${select('Export format','format',['JSON audit bundle','Methods outline (text)'])}${select('Source attachment policy','attachments',['Metadata and permitted excerpts only'])}</div>`+check('I checked provenance and source permissions','export-check')+`<div class="actions"><button class="primary" data-action="export" id="export" disabled>Download audit package</button>${btn('Preview manifest','manifest')}</div>`);ai=assistant('The package preserves rejected proposals and failed candidates alongside the approved record. Human-written decisions remain distinguishable from generated drafts.','AuditPackage A-02 and file manifest','Project event history · SD-02');break;
}return `<div class="heading"><div><h1>${String(step).padStart(2,'0')} &nbsp;${titles[step-1]}</h1><p class="sub">${subtitles[step-1]}</p></div><span class="badge ${roles[step-1].startsWith('AI')?'ai':roles[step-1].startsWith('Code')?'code':''}">${roles[step-1]}</span></div><div class="layout"><div>${body}</div>${ai}</div><div class="foot"><span>${stages[step-1]}</span><span>Screen S${String(step).padStart(2,'0')} · Example data only</span></div>`}
function render(){const parts=location.hash.slice(1).split('/');step=Math.max(1,Math.min(12,Number(parts[0])||1));variant=parts[1]||'';$('nav').innerHTML=titles.map((_,i)=>`${[0,3,6,10].includes(i)?`<div class="group">${({0:'Define study',3:'Build theory',6:'Assess and challenge',10:'Authorize and document'})[i]}</div>`:''}<a href="#${i+1}" class="${i+1===step?'active':''}" ${i+1===step?'aria-current="step"':''}><span class="num">${String(i+1).padStart(2,'0')}</span>${navLabels[i]}</a>`).join('');$('#main').innerHTML=screen();$('#toast').classList.add('hide');if($('#modal').open)$('#modal').close();if(variant==='error')showAIError();if(variant==='conflict')showConflict();if(variant==='connections')connections();}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hide')}
function showModal(title,html){$('#modal').innerHTML=`<h2>${title}</h2>${html}<div class="actions">${btn('Close','close')}</div>`;$('#modal').showModal()}
function connections(){showModal('Project connections',`<p class="small">Proposed adapter settings. This prototype does not store credentials or call providers.</p><div style="margin-top:16px">${select('Literature engine','lit',['Semantic Scholar adapter','Crossref metadata adapter','Permitted reference import'])}${select('Structured LLM','llm',['Anthropic Messages adapter','Gemini adapter'])}${select('Embedding provider','embedding',['Gemini embedding adapter','Cohere embedding adapter'])}</div><div class="notice">Production: bind a server-side secret reference. Never send API credentials to the browser or export bundle.</div>${input('Connection label','connection-name','Research team sandbox')}<div class="actions">${btn('Test connection','test-connection')}${btn('Save project configuration','save-config','primary')}</div>`)}
function showAIError(){const a=$('.assistant');a.innerHTML=`<h2>AI research assistant</h2>${tag('Run failed','bad')}<div class="notice red">No proposal available. The provider did not return a valid evidence-linked response.</div><p>Your source passage and saved review remain available.</p>${btn('Retry extraction','retry','primary')}<p class="small">Run X-02 · attempt 1 · retained for audit</p>`;}
function showConflict(){showModal('A newer version is available',`<div class="notice red">Your decision references v1. Another researcher saved v2 before your submission.</div><p>Your rationale remains in the draft. Review the current version before recording a decision.</p><div class="twocol" style="margin-top:15px"><div><b>Your base</b><p>v1 · unfamiliar technologies</p></div><div><b>Current approved</b><p>v2 · unanswered technology questions</p></div></div><div class="actions">${btn('Reload current version','reload-current','primary')}${btn('Keep my draft','close')}</div>`)}
function required(ids){const missing=ids.filter(id=>!$('#'+id)?.value.trim());document.querySelectorAll('.error').forEach(x=>x.remove());missing.forEach(id=>$('#'+id).insertAdjacentHTML('afterend','<div class="error">This field is required.</div>'));if(missing.length)$('#'+missing[0]).focus();return !missing.length}
function keep(){document.querySelectorAll('input:not([type=checkbox]),textarea,select').forEach(e=>formValues[e.id]=e.value)}
const explain={
'run-detail':['AI run record','<p>Run X-02 (synthetic fixture). Input evidence: E-02. Prompt version: extraction-v1. Output schema: claim-v1.</p><div class="history">Production record requires model ID, provider request ID, input hash, retrieved passage IDs, token usage, schema validation, timestamp, and run status.</div><p class="small">No live model request occurred in this prototype.</p>'],
'search-log':['Search provenance',table(['Query','Source','Returned'],[['QF-01','Synthetic adapter A','3'],['QF-01','Synthetic library','1']])+'<p class="small">4 results, 1 duplicate, 3 unique records. Store raw response hash, cursor, cutoff, and access.</p>'],
'compare':['Representation comparison',table(['Field','v0','Proposed v1'],[['Definition','Desire plus exploration','Desire to understand'],['Expression','Defining criterion','Possible observable expression']])],
'metric-detail':['Metric record M-01','<p>Approved v0/v1. Material decision D-01 = true. Outcome CONTINUE. Streak reset to 0.</p><div class="notice">No calibrated numeric distances are supplied in this fixture. Missing values remain undefined and cannot satisfy a gate.</div>'],
'frozen':['Frozen candidate C-01','<p>Approved representation v1. Scope S-01. Policy P-01. Eligible batches B-02 to B-04. Snapshot inputs become immutable when the human requests a challenge.</p>'],
'manifest':['Package manifest','<p>A-02 includes all version IDs, decision IDs, challenge partitions, access limitations, and provenance. Source files require explicit license eligibility.</p><div class="history">Synthetic fixture only. No real citations, full-text publications, or provider credentials are included.</div>']};
document.addEventListener('input',e=>{if(e.target.id)formValues[e.target.id]=e.target.value});document.addEventListener('change',()=>{if($('#freeze'))$('#freeze').disabled=!$('#candidate-check').checked||variant==='blocked';if($('#authorize'))$('#authorize').disabled=!$('#auth-check').checked;if($('#export'))$('#export').disabled=!$('#export-check').checked});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;keep();if(a==='close')return $('#modal').close();if(a==='connections')return connections();if(explain[a])return showModal(...explain[a]);if(a.startsWith('tab-')){document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('selected',x===el));const idx=+a.slice(4);$('#tab-content').innerHTML=[input('Definition *','definition',formValues.definition||'A person’s desire to understand unfamiliar technologies through information seeking and exploration.','textarea'),table(['Attribute','Status','Evidence'],[['Desire to understand','Proposed essential','E-01'],['Exploration','Possible expression','E-02'],['Dimensions','Not established','Not stated']]),table(['Boundary','Current position','Issue'],[['Technology familiarity','Unfamiliar technologies','Requires challenge'],['Required exploration','Insufficient by itself','E-02'],['Temporal form','Unresolved','Q-01']]),table(['From','Relation','To','Status'],[['Technology curiosity','May motivate','Information seeking','Proposition'],['Knowledge gap','May activate','Technology curiosity','Proposition']]),table(['Competitor','Potential distinction','Status'],[['Novelty seeking','Novelty preference versus desire to understand','Needs evidence'],['Learning orientation','Broad learning goals versus focal technology question','Needs evidence']])][idx];return;}
if(a==='save-brief'){if(required(['phenomenon','scope']))toast('Brief B-01 saved as a new draft version. Scope approval remains a human action.');}
else if(a==='probe')toast('AI draft: clarify temporal form and distinguish motivation from behavior. Q-01 remains open.');
else if(a==='search'){if(required(['query'])&&($('#source-a').checked||$('#source-b').checked))toast('Simulated search complete: 4 results, 1 duplicate, 3 unique records. No live API call.');else toast('Select at least one source and enter a query.');}
else if(a==='approve-scope'){if(required(['scope-note']))toast('Scope S-01 approved. Coverage tasks G-01 and G-02 remain open.');}
else if(['broaden','continue','targeted'].includes(a)){location.hash='2';}
else if(['verify','correct'].includes(a)){if(a==='correct'&&!required(['extraction-note']))return;local.verified=true;toast(a==='verify'?'Extraction CL-02 verified by the human. The synthesis remains a proposal.':'Corrected extraction saved with the original AI output retained.');}
else if(a==='unresolved')toast('Issue recorded as unresolved. Candidate-stop eligibility remains blocked until adjudication.');
else if(a==='submit-proposal'){if(required(['definition'])){toast('Proposal R-01 submitted for human adjudication. Approved snapshot unchanged.');}}
else if(a==='save-draft')toast('Draft saved. This action does not approve the representation.');
else if(a==='record-decision'){if(required(['rationale'])){const d=$('#decision').value,m=$('#materiality').value;toast(d==='Leave unresolved'||m==='Unresolved'?'Unresolved decision saved. Stop eligibility is blocked.':d==='Reject revision'?'Rejection saved. Approved representation unchanged.':m.includes('changing')?'Accepted material revision. New approved version v1. Stability streak reset to 0.':'Accepted nonmaterial revision. Recompute eligible batch metrics before awarding stability credit.');}}
else if(a==='freeze'){if(required(['candidate-note'])&&variant!=='blocked')showModal('Freeze candidate C-01',`<p>Freeze approved v1, scope S-01, policy P-01, and gate records. Start independent challenge H-01.</p><div class="notice">This creates a candidate, not a stop authorization.</div>${btn('Confirm freeze and open challenges','confirm-freeze','primary')}`);}
else if(a==='confirm-freeze'){location.hash='9';}
else if(a==='run-challenge')toast('Simulated challenge H-01 complete. Finding F-09 requires human adjudication in step 10.');
else if(a==='reopen'){if(required(['finding-note'])){const f=$('#finding').value;toast(f==='Material boundary change'?'C-01 retired. Streak reset to 0. E-09 moved to development. Create a revision in step 6.':f==='Coverage gap'?'Coverage task created. Candidate blocked until coverage and convergence are reassessed.':f==='Unresolved'?'Materiality remains unresolved. Authorization blocked.':'Nonmaterial finding recorded. All other required challenge tests must still pass.');}}
else if(a==='authorize'){if(required(['cutoff','stop-scope','stop-note']))showModal('Authorize provisional stop',`<p>Candidate C-02 · scope ${esc($('#stop-scope').value)} · cutoff ${esc($('#cutoff').value)}</p><div class="quote">${esc($('#stop-note').value)}</div><p class="small">Signer: current authorized researcher. Production rechecks every gate inside the authorization transaction.</p><div class="actions">${btn('Confirm authorization','confirm-auth','primary')}</div>`);}
else if(a==='confirm-auth'){local.authorized=true;$('#modal').close();toast('Synthetic stop decision SD-02 recorded. Scope, cutoff, rationale, signer, and reopening conditions saved.');}
else if(a==='budget')showModal('Record resource limit',input('Resource limitation *','budget-note','')+notice('This outcome records an incomplete search and does not claim theoretical saturation.')+btn('Save incomplete-search decision','save-budget','primary'));
else if(a==='save-budget'){if(required(['budget-note'])){$('#modal').close();toast('Resource limit recorded. Search status: incomplete.');}}
else if(a==='export'){const payload={prototype:true,synthetic:true,package:'A-02',candidate:'C-02',scope:'S-02',stop:'SD-02',records:['B-01','S-01','S-02','v0','v1','v2','C-01-retired','H-01','C-02','H-02','SD-02'],note:'Demonstration manifest, not research evidence'};const txt=$('#format').value.startsWith('JSON')?JSON.stringify(payload,null,2):'SYNTHETIC METHODS OUTLINE\nResearch framing\nSearch protocol and access\nEvidence review\nConstruct adjudication\nConvergence and fresh challenges\nScoped human authorization\n';const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));link.download=$('#format').value.startsWith('JSON')?'A-02-demo.json':'A-02-methods-demo.txt';link.click();URL.revokeObjectURL(link.href);toast('Synthetic audit manifest downloaded.');}
else if(a==='retry'){render();toast('Simulated retry available. No live provider request occurred.');}
else if(a==='reload-current'){$('#modal').close();toast('Current approved v2 loaded for comparison. Your rationale remains in the draft.');}
else if(a==='test-connection')toast('Simulation: adapter contract responds. Production test must verify capabilities and credential scope.');
else if(a==='save-config'){$('#modal').close();toast('Demo configuration selected. Production configuration is versioned and server controlled.');}
});$('#connections').onclick=connections;window.addEventListener('hashchange',render);render();
</script></body></html>
